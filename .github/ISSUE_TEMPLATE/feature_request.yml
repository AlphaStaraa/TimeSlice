name: 功能建议 / Feature request
description: 建议切片、工作流或界面改进
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？ / What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed behavior
      description: 可附示意或效果参考，并说明期望的平台
    validations:
      required: true
