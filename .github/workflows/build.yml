name: TimeSlice quality and builds

on:
  workflow_dispatch:
    inputs:
      package_desktop:
        description: Build desktop CI preview archives after quality checks
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_CONTROLS_STYLE: Basic

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.5
      - run: python -m ruff format --check .
      - run: python -m ruff check --no-cache .
      - run: python tools/verify_source.py
      - run: python tools/index_functions.py --check
      - run: python tools/audit_publication.py --source . --report build/publication-audit.json

  numerics:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r requirements.txt
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1
      - run: python tools/check_desktop.py --cpu-only
      - run: python tools/golden.py
      - run: python tools/check_utf8_export.py
      - run: python tools/check_ui.py
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerics-${{ runner.os }}
          path: |
            build/golden/report.json
            build/check/ui/*.png
            build/check/ui/report.json
          if-no-files-found: warn

  lite-quality:
    needs: [source, numerics]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r lite/requirements.txt
      - run: python tools/build_lite.py
      - run: python tools/golden.py --stage build/lite/stage/app --report build/lite/golden.json
      - run: python tools/check_lite.py
      - run: python tools/benchmark.py --identity-only --output build/benchmark/identity.json
        id: machine
      - uses: actions/cache/restore@v4
        with:
          path: build/benchmark/baseline.json
          key: perf-${{ runner.os }}-${{ steps.machine.outputs.hardware_id }}-${{ github.sha }}
          restore-keys: |
            perf-${{ runner.os }}-${{ steps.machine.outputs.hardware_id }}-
      - run: python tools/benchmark.py --baseline build/benchmark/baseline.json --repeats 3
        id: perf
      - name: Record successful main baseline
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.perf.outputs.baseline_allowed == 'true'
        run: python -c "import shutil; shutil.copy2('build/benchmark/current.json', 'build/benchmark/baseline.json')"
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.perf.outputs.baseline_allowed == 'true'
        with:
          path: build/benchmark/baseline.json
          key: perf-${{ runner.os }}-${{ steps.machine.outputs.hardware_id }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-quality-${{ runner.os }}
          path: |
            build/benchmark/*.json
            build/lite/golden.json
            build/lite/verification/*.png
            build/lite/verification/report.json
          if-no-files-found: warn

  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.package_desktop
    needs: [source, numerics, lite-quality]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_desktop.py --package
      - run: python tools/export_source.py --destination build/ci-source
      - name: Archive application and corresponding source
        shell: python
        run: |
          import json, pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          metadata = 'mac-release.json' if sys.platform == 'darwin' else 'windows-release.json'
          release = json.loads((root / 'mac-5.0-redesign/resources' / metadata).read_text(encoding='utf-8'))
          shutil.make_archive(str(root / 'dist/TimeSlice-CI-source'), 'zip', root / 'build/ci-source')
          if sys.platform == 'darwin':
              app = root / 'dist' / ('macOS-' + release['version']) / '时刃.app'
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(app), str(root / 'dist/TimeSlice-CI-macOS.zip')], check=True)
          else:
              app = root / 'dist' / ('Windows-' + release['version']) / '时刃'
              shutil.make_archive(str(root / 'dist/TimeSlice-CI-Windows'), 'zip', app.parent, app.name)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-CI-${{ runner.os }}-preview
          path: dist/TimeSlice-CI-*.zip
          if-no-files-found: error

  android:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p mobile/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-CI-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
